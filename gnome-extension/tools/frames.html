<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Charger Cat frame renderer</title>
  <script type="importmap">
    {
      "imports": {
        "three": "../../vendor/three/three.module.min.js",
        "three/addons/": "../../vendor/three/addons/"
      }
    }
  </script>
</head>
<body style="margin:0;background:#111">
  <!-- Renders the small PNG animation frames used by the GNOME Shell extension.
       Driven by scripts/render-cat-frames.mjs; see window.renderFrames below. -->
  <script type="module">
    import * as THREE from 'three';
    import { CATS, buildCat, applyCatPose, catPose, CAT_ACTS } from '../../js/cat.js';

    const W = 90;
    const H = 54;
    const SS = 3; // supersampling
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(W * SS, H * SS, false);
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.NeutralToneMapping;
    const out = document.createElement('canvas');
    out.width = W;
    out.height = H;
    const g = out.getContext('2d');

    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445577, 1.8));
    const key = new THREE.DirectionalLight(0xffffff, 2.3);
    key.position.set(-2, 4, 5);
    scene.add(key);
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);

    const FACING = Math.PI / 2 - 0.22; // side-on, running right (toward the battery icon)

    // Gallop loop: `n` evenly spaced phases of one stride.
    function runPose(i, n) {
      const p = catPose();
      CAT_ACTS.run.fn(p, i / n / 2, { inPlace: true, facing: FACING, runHz: 2, track: 0 });
      return p;
    }

    // Sitting, purring loop for "fully charged": tail wag, gentle head tilt, one blink.
    function sitPose(i, n) {
      const p = catPose();
      CAT_ACTS.sit.fn(p, 0, { facing: FACING, dur: 10 });
      const u = i / n;
      p.headY = -0.5; // look toward the viewer
      p.headZ = Math.sin(u * Math.PI * 2) * 0.12;
      p.tailUp = 0.95;
      p.tailWrap = 0;
      p.tailCurl = 0.22;
      p.tailWag = 0.4;
      p.tailHz = 1; // phase driven by the t passed to applyCatPose
      p.blink = i === Math.floor(n * 0.7) || i === Math.floor(n * 0.7) + 1 ? 1 : 0;
      p._t = u;
      return p;
    }

    function frameBox(rig, poses) {
      const box = new THREE.Box3();
      for (const p of poses) {
        applyCatPose(rig, p, p._t ?? 0);
        rig.root.updateMatrixWorld(true);
        box.union(new THREE.Box3().setFromObject(rig.root));
      }
      return box;
    }

    window.renderFrames = (coatId, kind, n) => {
      const def = CATS.find((c) => c.id === coatId);
      const rig = buildCat(def);
      scene.add(rig.root);
      const poses = [];
      for (let i = 0; i < n; i++) poses.push(kind === 'run' ? runPose(i, n) : sitPose(i, n));

      // One camera for the whole loop so the cat doesn't jitter between frames.
      const box = frameBox(rig, poses);
      const c = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const aspect = W / H;
      const halfH = Math.max(size.y / 2, size.x / 2 / aspect) * 1.04;
      camera.left = -halfH * aspect;
      camera.right = halfH * aspect;
      camera.top = halfH;
      camera.bottom = -halfH;
      camera.position.set(c.x, c.y + 1.2, c.z + 10);
      camera.lookAt(c.x, c.y, c.z);
      camera.updateProjectionMatrix();

      const urls = [];
      for (const p of poses) {
        applyCatPose(rig, p, p._t ?? 0);
        renderer.render(scene, camera);
        g.clearRect(0, 0, W, H);
        g.drawImage(renderer.domElement, 0, 0, W, H);
        urls.push(out.toDataURL('image/png'));
      }
      scene.remove(rig.root);
      return urls;
    };
    window.coats = CATS.map((c) => c.id);
    window.ready = true;
  </script>
</body>
</html>

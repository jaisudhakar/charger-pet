name: Build desktop app

# Builds the tray app installers for Windows, macOS and Linux.
# Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.0.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          # No code-signing certificate is configured; build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: charger-pet-${{ runner.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # On a v* tag, publish the installers as a GitHub Release so they have plain
  # download links (no login, no zip).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la artifacts
          cat > notes.md <<'NOTES'
          **Ubuntu** — one command:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/jaisudhakar/charger-pet/HEAD/scripts/install-ubuntu.sh | bash
          ```
          or download `charger-pet_*_amd64.deb` below and run `sudo apt install ./charger-pet_*_amd64.deb`.

          **Windows** — download `Charger.Pet.Setup.*.exe` and run it (SmartScreen: More info → Run anyway).

          **macOS** — download the `.dmg` for your Mac (`arm64` = Apple Silicon, `x64` = Intel); the first time, right-click the app → Open.
          NOTES
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Charger Pet $TAG" --notes-file notes.md

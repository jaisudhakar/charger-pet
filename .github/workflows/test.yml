name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: GNOME extension is built from the latest sources
        run: |
          npm run build:gnome
          git diff --exit-code gnome/
      - name: Install scripts parse
        run: bash -n scripts/install-ubuntu.sh && bash -n scripts/uninstall-ubuntu.sh

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#060a1a" />
  <meta name="description" content="A 3D charging pet: ten animated heroes live on your charge icon and react when you plug in." />
  <title>Charger Pet</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body data-mode="battery">
  <canvas id="scene" aria-label="Animated 3D charging pet"></canvas>

  <header class="hud-top">
    <div class="level" aria-live="polite"><span id="pct">--</span><small>%</small></div>
    <div id="status" class="status">Checking battery…</div>
  </header>

  <div class="toolbar">
    <button id="fullscreenBtn" class="icon-btn" type="button" aria-label="Fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
    </button>
  </div>

  <div id="bubble" class="bubble" role="status"></div>

  <footer class="hud-bottom">
    <div class="hero-info">
      <span id="heroNum" class="hero-num"></span>
      <div>
        <div id="heroName" class="hero-name"></div>
        <div id="heroPower" class="hero-power"></div>
      </div>
      <span id="activity" class="chip">Chilling</span>
    </div>
    <div class="dial-wrap">
      <button id="prevHero" class="icon-btn" type="button" aria-label="Previous hero">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="dial" class="dial" role="toolbar" aria-label="Choose a hero"></div>
      <button id="nextHero" class="icon-btn" type="button" aria-label="Next hero">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="actions">
      <button id="randomHero" class="pill" type="button">Transform</button>
      <button id="plugBtn" class="pill primary" type="button" hidden aria-pressed="false">Plug in cable</button>
    </div>
  </footer>

  <section id="settings" class="sheet" hidden aria-label="Settings">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button id="closeSettings" class="icon-btn" type="button" aria-label="Close settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <label class="toggle"><input id="optTransform" type="checkbox" /><span>Transform into a random hero when plugged in</span></label>
    <label class="toggle"><input id="optAwake" type="checkbox" /><span>Keep the screen on while charging</span></label>
    <label class="toggle"><input id="optSound" type="checkbox" /><span>Sound effects</span></label>
    <label class="toggle"><input id="optDemo" type="checkbox" /><span>Demo mode (simulate the battery)</span></label>
    <label class="range"><span>Demo battery level</span><input id="demoLevel" type="range" min="1" max="100" value="42" /></label>
    <p class="hint">Tap a hero to make it react · drag to look around · keys: ←/→ switch, 1–0 pick, P plug.</p>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
